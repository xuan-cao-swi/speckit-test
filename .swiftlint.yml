# SwiftLint configuration for Photo Album Organizer
# Enforces code quality standards from constitution.md

disabled_rules:
  - trailing_whitespace

opt_in_rules:
  - explicit_type_interface
  - closure_spacing
  - empty_count
  - explicit_init
  - first_where
  - sorted_imports
  - vertical_whitespace_closing_braces
  - vertical_whitespace_opening_braces

included:
  - Sources
  - Tests

excluded:
  - .build
  - db
  - Public

# Line length
line_length:
  warning: 120
  error: 150

# File length
file_length:
  warning: 500
  error: 800

# Function body length
function_body_length:
  warning: 40
  error: 60

# Type body length
type_body_length:
  warning: 300
  error: 400

# Cyclomatic complexity
cyclomatic_complexity:
  warning: 10
  error: 15

# Nesting depth
nesting:
  type_level: 2
  statement_level: 4

# Identifier naming
identifier_name:
  min_length:
    warning: 2
  max_length:
    warning: 40
    error: 50
  excluded:
    - id
    - db

# Force unwrapping (discouraged)
force_unwrapping: warning

# Force try (discouraged)
force_try: warning

# Custom rules
custom_rules:
  no_print:
    name: "No Print Statements"
    regex: "print\\("
    message: "Use logger instead of print()"
    severity: warning
